<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Taraba Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #087f5b;
      color: white;
      text-align: center;
      padding: 13px;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .panel {
      background: white;
      padding: 10px;
      position: relative;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 6px;
      border: none;
      border-radius: 8px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    .stop {
      background: #d62828;
    }

    .location {
      background: #1565c0;
    }

    #status {
      font-size: 13px;
      padding: 5px 0;
    }

    #result {
      font-size: 14px;
      line-height: 1.5;
    }

    #map {
      width: 100%;
      height: calc(100vh - 290px);
    }

    .live-label {
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-weight: bold;
    }

    .from-label {
      background: #087f5b;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-weight: bold;
    }

    .to-label {
      background: #d62828;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<header>

  <h1>📍 Taraba Live Map</h1>

  <p>
    Live GPS navigation
  </p>

</header>


<div class="panel">


  <input
    id="from"
    type="text"
    placeholder="📍 From — e.g. Gassol"
  >


  <input
    id="to"
    type="text"
    placeholder="📍 To — e.g. Jalingo"
  >


  <button onclick="calculateRoute()">
    🛣️ SHOW ROUTE
  </button>


  <button
    class="location"
    onclick="startLiveLocation()"
  >
    📍 START LIVE LOCATION
  </button>


  <button
    class="stop"
    onclick="stopLiveLocation()"
  >
    ⛔ STOP LIVE LOCATION
  </button>


  <div id="status">

    GPS is not active.

  </div>


  <div id="result">

    Enter a destination or start live location.

  </div>


</div>


<div id="map"></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =========================================
   MAP
========================================= */


const map =
  L.map("map")
   .setView(
     [8.0, 10.8],
     8
   );


/* =========================================
   OPENSTREETMAP
========================================= */


L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"

  }

).addTo(map);



/* =========================================
   VARIABLES
========================================= */


let liveMarker = null;

let accuracyCircle = null;

let watchID = null;

let routeLine = null;

let fromMarker = null;

let toMarker = null;


/* GPS STABILITY */

let lastStableLat = null;

let lastStableLon = null;


/*
   Minimum movement required before
   updating the marker.
*/

const MIN_MOVEMENT_METERS = 10;



/* =========================================
   DISTANCE BETWEEN GPS POINTS
========================================= */


function distanceMeters(

  lat1,
  lon1,
  lat2,
  lon2

) {


  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =

    Math.sin(dp / 2) *
    Math.sin(dp / 2)

    +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) *
    Math.sin(dl / 2);


  const c =

    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(
        1 - a
      )

    );


  return R * c;

}



/* =========================================
   START LIVE LOCATION
========================================= */


function startLiveLocation() {


  if (
    !navigator.geolocation
  ) {

    document.getElementById(
      "status"
    ).innerHTML =

      "❌ GPS is not supported.";

    return;

  }


  document.getElementById(
    "status"
  ).innerHTML =

    "🔎 Getting your location...";


  /* RESET */

  lastStableLat = null;

  lastStableLon = null;


  /* STOP OLD WATCH */

  if (
    watchID !== null
  ) {

    navigator.geolocation.clearWatch(
      watchID
    );

  }


  /* START GPS */

  watchID =

    navigator.geolocation.watchPosition(

      updateLiveLocation,

      gpsError,

      {

        enableHighAccuracy: true,

        maximumAge: 1000,

        timeout: 20000

      }

    );

}



/* =========================================
   UPDATE LIVE LOCATION
========================================= */


function updateLiveLocation(
  position
) {


  const lat =
    position.coords.latitude;


  const lon =
    position.coords.longitude;


  const accuracy =
    Math.round(
      position.coords.accuracy
    );


  /*
    Ignore extremely inaccurate
    GPS readings.
  */

  if (
    accuracy > 100
  ) {

    document.getElementById(
      "status"
    ).innerHTML =

      "🟡 GPS accuracy is low: " +
      accuracy +
      " m";

    return;

  }


  /*
    GPS DRIFT FILTER
  */

  if (
    lastStableLat !== null &&
    lastStableLon !== null
  ) {


    const movement =

      distanceMeters(

        lastStableLat,

        lastStableLon,

        lat,

        lon

      );


    /*
      If movement is less than
      10 meters and GPS accuracy
      is not excellent, ignore it.
    */

    if (

      movement <
      MIN_MOVEMENT_METERS

      &&

      accuracy >
      20

    ) {

      return;

    }

  }


  /*
    Save stable location.
  */

  lastStableLat = lat;

  lastStableLon = lon;



  /* =================================
     STATUS
  ================================= */


  document.getElementById(
    "status"
  ).innerHTML =

    "🟢 LIVE GPS ACTIVE • " +

    "Accuracy: " +

    accuracy +

    " m";



  /* =================================
     CREATE MARKER
  ================================= */


  if (
    !liveMarker
  ) {


    liveMarker =

      L.marker(

        [
          lat,
          lon
        ]

      )

      .addTo(map)

      .bindTooltip(

        "📍 YOU ARE HERE",

        {

          permanent: true,

          direction: "top",

          className:
            "live-label"

        }

      );


    /*
      Accuracy circle
    */

    accuracyCircle =

      L.circle(

        [
          lat,
          lon
        ],

        {

          radius:
            accuracy,

          weight: 1,

          fillOpacity:
            0.10

        }

      ).addTo(map);


    /*
      Move camera to user.
    */

    map.setView(

      [
        lat,
        lon
      ],

      16

    );

  }

  else {


    /*
      Move marker.
    */

    liveMarker.setLatLng(

      [
        lat,
        lon
      ]

    );


    /*
      Move accuracy circle.
    */

    accuracyCircle.setLatLng(

      [
        lat,
        lon
      ]

    );


    accuracyCircle.setRadius(
      accuracy
    );

  }



  /* =================================
     INFORMATION
  ================================= */


  document.getElementById(
    "result"
  ).innerHTML =

    "📍 Your live location<br>" +

    "Latitude: <b>" +

    lat.toFixed(6) +

    "</b><br>" +

    "Longitude: <b>" +

    lon.toFixed(6) +

    "</b><br>" +

    "GPS accuracy: <b>" +

    accuracy +

    " m</b>";

}



/* =========================================
   GPS ERROR
========================================= */


function gpsError(error) {


  let message =
    "❌ Unable to get your location.";


  if (
    error.code === 1
  ) {

    message =
      "❌ Location permission was denied.";

  }


  else if (
    error.code === 2
  ) {

    message =
      "❌ Your location is unavailable.";

  }


  else if (
    error.code === 3
  ) {

    message =
      "❌ GPS request timed out.";

  }


  document.getElementById(
    "status"
  ).innerHTML =
    message;

}



/* =========================================
   STOP LIVE GPS
========================================= */


function stopLiveLocation() {


  if (
    watchID !== null
  ) {

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }


  document.getElementById(
    "status"
  ).innerHTML =

    "🔴 Live GPS stopped.";

}



/* =========================================
   FIND PLACE
========================================= */


async function findPlace(
  place
) {


  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&q=" +

    encodeURIComponent(

      place +
      ", Taraba, Nigeria"

    ) +

    "&limit=1";


  const response =
    await fetch(url);


  const data =
    await response.json();


  if (
    !data.length
  ) {

    return null;

  }


  return {

    lat:
      Number(
        data[0].lat
      ),

    lon:
      Number(
        data[0].lon
      ),

    name:
      data[0].display_name

  };

}



/* =========================================
   DRAW ROAD ROUTE
========================================= */


async function drawRoute(

  fromLat,
  fromLon,

  toLat,
  toLon

) {


  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    fromLon +

    "," +

    fromLat +

    ";" +

    toLon +

    "," +

    toLat +

    "?overview=full&geometries=geojson";


  const response =
    await fetch(url);


  const data =
    await response.json();


  if (
    data.code !== "Ok"
  ) {

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ No road route found.";

    return;

  }


  const route =
    data.routes[0];


  /* REMOVE OLD ROUTE */

  if (
    routeLine
  ) {

    map.removeLayer(
      routeLine
    );

  }


  /* DRAW */

  routeLine =

    L.geoJSON(

      route.geometry,

      {

        style: {

          weight: 6,

          opacity: 0.85

        }

      }

    ).addTo(map);


  /* DISTANCE */

  const km =

    (
      route.distance /
      1000
    ).toFixed(1);


  /* TIME */

  const minutes =

    Math.round(

      route.duration /
      60

    );


  let time;


  if (
    minutes >= 60
  ) {

    time =

      Math.floor(
        minutes / 60
      ) +

      " hr " +

      (
        minutes % 60
      ) +

      " min";

  }

  else {

    time =
      minutes +
      " min";

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "🛣️ Route ready<br>" +

    "📏 Distance: <b>" +

    km +

    " km</b><br>" +

    "⏱️ Estimated time: <b>" +

    time +

    "</b>";


  map.fitBounds(

    routeLine.getBounds(),

    {

      padding:
        [40, 40]

    }

  );

}



/* =========================================
   CALCULATE ROUTE
========================================= */


async function calculateRoute() {


  const fromText =

    document.getElementById(
      "from"
    ).value.trim();


  const toText =

    document.getElementById(
      "to"
    ).value.trim();


  if (
    !fromText ||
    !toText
  ) {

    document.getElementById(
      "result"
    ).innerHTML =

      "⚠️ Enter both From and To.";

    return;

  }


  document.getElementById(
    "result"
  ).innerHTML =

    "🔎 Finding locations...";


  try {


    const from =

      await findPlace(
        fromText
      );


    const to =

      await findPlace(
        toText
      );


    if (!from) {

      document.getElementById(
        "result"
      ).innerHTML =

        "❌ From location not found.";

      return;

    }


    if (!to) {

      document.getElementById(
        "result"
      ).innerHTML =

        "❌ To location not found.";

      return;

    }


    /* REMOVE OLD MARKERS */

    if (
      fromMarker
    ) {

      map.removeLayer(
        fromMarker
      );

    }


    if (
      toMarker
    ) {

      map.removeLayer(
        toMarker
      );

    }


    /* FROM MARKER */

    fromMarker =

      L.marker(

        [
          from.lat,
          from.lon
        ],

        {

          draggable:
            true

        }

      )

      .addTo(map)

      .bindTooltip(

        "FROM",

        {

          permanent:
            true,

          direction:
            "top",

          className:
            "from-label"

        }

      );


    /* TO MARKER */

    toMarker =

      L.marker(

        [
          to.lat,
          to.lon
        ],

        {

          draggable:
            true

        }

      )

      .addTo(map)

      .bindTooltip(

        "TO",

        {

          permanent:
            true,

          direction:
            "top",

          className:
            "to-label"

        }

      );


    /* DRAW ROUTE */

    await drawRoute(

      from.lat,
      from.lon,

      to.lat,
      to.lon

    );


  }

  catch(error) {

    console.error(
      error
    );

    document.getElementById(
      "result"
    ).innerHTML =

      "❌ Internet or map service error.";

  }

}


</script>

</body>

  </html>

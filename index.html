<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taraba Live Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f5;
}

header{
  background:#087f5b;
  color:white;
  text-align:center;
  padding:14px 10px;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
}

.panel{
  background:white;
  padding:10px;
  position:relative;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:4px 0;
}

select,input{
  width:100%;
  padding:12px;
  margin-bottom:7px;
  border:1px solid #ccc;
  border-radius:8px;
  background:white;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-bottom:7px;
  border:0;
  border-radius:8px;
  background:#087f5b;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.blue{
  background:#1565c0;
}

.red{
  background:#d62828;
}

#status{
  padding:6px 0;
  font-size:13px;
  font-weight:bold;
}

#result{
  font-size:14px;
  line-height:1.5;
  padding:5px 0;
}

#map{
  width:100%;
  height:calc(100vh - 465px);
  min-height:400px;
}

.live-label{
  background:#1565c0;
  color:white;
  border:0;
  border-radius:6px;
  padding:5px 8px;
  font-weight:bold;
}

.from-label{
  background:#087f5b;
  color:white;
  border:0;
  border-radius:6px;
  padding:5px 8px;
  font-weight:bold;
}

.to-label{
  background:#d62828;
  color:white;
  border:0;
  border-radius:6px;
  padding:5px 8px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🇳🇬 Taraba Live Map</h1>
  <p>LGA • Ward • Area • Live Location • Route</p>
</header>

<div class="panel">

<label>🏛️ State</label>

<select id="state">
  <option value="Taraba">Taraba</option>
</select>

<label>🏛️ LGA</label>

<select id="lga">
  <option>Loading...</option>
</select>

<label>🏘️ Ward</label>

<select id="ward" disabled>
  <option>Select LGA first</option>
</select>

<label>📍 Area</label>

<input
  id="area"
  type="text"
  placeholder="Enter area or place"
>

<button onclick="showArea()">
📍 SHOW AREA
</button>

<label>🛣️ From</label>

<input
  id="from"
  type="text"
  placeholder="Example: Jalingo"
>

<label>🛣️ To</label>

<input
  id="to"
  type="text"
  placeholder="Example: Wukari"
>

<button onclick="calculateRoute()">
🛣️ CALCULATE ROUTE
</button>

<button class="blue" onclick="startGPS()">
📍 START LIVE LOCATION
</button>

<button class="red" onclick="stopGPS()">
⛔ STOP LIVE LOCATION
</button>

<div id="status">
GPS is not active.
</div>

<div id="result">
Loading Taraba...
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================
   MAP
========================================= */

const map = L.map("map").setView(
  [8.0,10.6],
  8
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================
   VARIABLES
========================================= */

let fullData = [];

let tarabaData = null;

let liveMarker = null;
let accuracyCircle = null;
let watchID = null;

let selectedMarker = null;

let fromMarker = null;
let toMarker = null;
let routeLine = null;


/* =========================================
   CORRECT DATA URL
========================================= */

const DATA_URL =
"https://raw.githubusercontent.com/temikeezy/nigeria-geojson-data/main/data/full.json";


/* =========================================
   LOAD DATA
========================================= */

async function loadTaraba(){

  const result =
  document.getElementById("result");

  try{

    result.innerHTML =
    "🔎 Loading real Taraba LGA and Ward data...";

    const response =
    await fetch(DATA_URL);

    if(!response.ok){

      throw new Error(
        "Data could not be downloaded"
      );

    }

    fullData =
    await response.json();

    /*
      Find Taraba.
    */

    tarabaData =
    fullData.find(
      item =>
      String(item.state).toLowerCase()
      ===
      "taraba"
    );

    if(!tarabaData){

      throw new Error(
        "Taraba was not found"
      );

    }

    loadLGAs();

  }
  catch(error){

    console.error(error);

    result.innerHTML =
    "❌ Could not load Taraba data.<br>" +
    "Please check your internet connection.";

  }

}


/* =========================================
   LOAD ALL TAraba LGAs
========================================= */

function loadLGAs(){

  const lga =
  document.getElementById("lga");

  lga.innerHTML =
  '<option value="">Select LGA</option>';

  if(
    !tarabaData.lgas ||
    !Array.isArray(tarabaData.lgas)
  ){

    document.getElementById("result").innerHTML =
    "❌ Taraba LGA data is unavailable.";

    return;

  }

  tarabaData.lgas.forEach(
    (item,index)=>{

      const option =
      document.createElement("option");

      option.value = index;

      option.textContent =
      item.name;

      lga.appendChild(option);

    }
  );

  document.getElementById("result").innerHTML =
    "🇳🇬 <b>Taraba State</b><br>" +
    "Choose an LGA.";

}


/* =========================================
   LGA CHANGE
========================================= */

document.getElementById("lga")
.addEventListener(
  "change",
  function(){

    const index =
    Number(this.value);

    const ward =
    document.getElementById("ward");

    ward.innerHTML =
    '<option value="">Select Ward</option>';

    ward.disabled = true;

    if(
      !Number.isInteger(index) ||
      !tarabaData.lgas[index]
    ){

      return;

    }

    const selectedLGA =
    tarabaData.lgas[index];

    if(
      !selectedLGA.wards ||
      !Array.isArray(selectedLGA.wards)
    ){

      return;

    }

    selectedLGA.wards.forEach(
      (item,i)=>{

        const option =
        document.createElement("option");

        option.value = i;

        option.textContent =
        item.name;

        ward.appendChild(option);

      }
    );

    ward.disabled = false;

    document.getElementById("result").innerHTML =
      "🏛️ LGA: <b>" +
      selectedLGA.name +
      "</b><br>" +
      "🏘️ Now choose a Ward.";

  }
);


/* =========================================
   WARD CHANGE
========================================= */

document.getElementById("ward")
.addEventListener(
  "change",
  function(){

    const lgaIndex =
    Number(
      document.getElementById("lga").value
    );

    const wardIndex =
    Number(this.value);

    if(
      !tarabaData.lgas[lgaIndex]
    ){

      return;

    }

    const lga =
    tarabaData.lgas[lgaIndex];

    const ward =
    lga.wards[wardIndex];

    if(!ward){

      return;

    }

    const lat =
    Number(ward.latitude);

    const lon =
    Number(ward.longitude);

    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ){

      document.getElementById("result").innerHTML =
      "⚠️ This ward has no map coordinates.";

      return;

    }

    if(selectedMarker){

      map.removeLayer(
        selectedMarker
      );

    }

    selectedMarker =
    L.marker(
      [lat,lon]
    )
    .addTo(map)
    .bindTooltip(
      ward.name,
      {
        permanent:true,
        direction:"top"
      }
    );

    map.setView(
      [lat,lon],
      14
    );

    document.getElementById("area").value =
      ward.name;

    document.getElementById("to").value =
      ward.name + ", " +
      lga.name + ", Taraba";

    document.getElementById("result").innerHTML =
      "🏛️ LGA: <b>" +
      lga.name +
      "</b><br>" +
      "🏘️ Ward: <b>" +
      ward.name +
      "</b><br>" +
      "📍 Ward shown on map.";

  }
);


/* =========================================
   SHOW AREA
========================================= */

async function showArea(){

  const area =
  document.getElementById("area")
  .value
  .trim();

  if(!area){

    document.getElementById("result").innerHTML =
      "⚠️ Enter an area.";

    return;

  }

  document.getElementById("result").innerHTML =
    "🔎 Finding area...";

  try{

    const result =
    await searchPlace(area);

    if(!result){

      document.getElementById("result").innerHTML =
        "❌ Area not found.";

      return;

    }

    if(selectedMarker){

      map.removeLayer(
        selectedMarker
      );

    }

    selectedMarker =
    L.marker(
      [
        result.lat,
        result.lon
      ]
    )
    .addTo(map)
    .bindTooltip(
      area,
      {
        permanent:true,
        direction:"top"
      }
    );

    map.setView(
      [
        result.lat,
        result.lon
      ],
      15
    );

    document.getElementById("result").innerHTML =
      "📍 Area: <b>" +
      area +
      "</b><br>" +
      "🗺️ Location shown.";

  }
  catch(error){

    document.getElementById("result").innerHTML =
      "❌ Area search failed.";

  }

}


/* =========================================
   SEARCH PLACE
========================================= */

async function searchPlace(place){

  const url =
  "https://nominatim.openstreetmap.org/search" +
  "?format=jsonv2" +
  "&limit=1" +
  "&q=" +
  encodeURIComponent(
    place + ", Taraba, Nigeria"
  );

  const response =
  await fetch(url);

  const data =
  await response.json();

  if(!data.length){

    return null;

  }

  return {

    lat:
    Number(data[0].lat),

    lon:
    Number(data[0].lon)

  };

}


/* =========================================
   LIVE GPS
========================================= */

function startGPS(){

  if(!navigator.geolocation){

    document.getElementById("status").innerHTML =
      "❌ GPS is not supported.";

    return;

  }

  document.getElementById("status").innerHTML =
    "🔎 Getting your live location...";

  if(watchID !== null){

    navigator.geolocation.clearWatch(
      watchID
    );

  }

  watchID =
  navigator.geolocation.watchPosition(
    updateGPS,
    gpsError,
    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:20000
    }
  );

}


/* =========================================
   GPS UPDATE
========================================= */

function updateGPS(position){

  const lat =
  position.coords.latitude;

  const lon =
  position.coords.longitude;

  /*
    We intentionally do NOT show
    GPS accuracy.
  */

  document.getElementById("status").innerHTML =
    "🟢 LIVE GPS ACTIVE";

  if(!liveMarker){

    liveMarker =
    L.marker(
      [lat,lon]
    )
    .addTo(map)
    .bindTooltip(
      "📍 YOU ARE HERE",
      {
        permanent:true,
        direction:"top",
        className:"live-label"
      }
    );

    accuracyCircle =
    L.circle(
      [lat,lon],
      {
        radius:30,
        weight:1,
        fillOpacity:.08
      }
    ).addTo(map);

    map.setView(
      [lat,lon],
      16
    );

  }
  else{

    liveMarker.setLatLng(
      [lat,lon]
    );

    accuracyCircle.setLatLng(
      [lat,lon]
    );

  }

  document.getElementById("result").innerHTML =
    "📍 <b>Your live location is active.</b>";

}


/* =========================================
   GPS ERROR
========================================= */

function gpsError(error){

  if(error.code === 1){

    document.getElementById("status").innerHTML =
      "❌ Location permission denied.";

  }
  else if(error.code === 2){

    document.getElementById("status").innerHTML =
      "❌ Location unavailable.";

  }
  else if(error.code === 3){

    document.getElementById("status").innerHTML =
      "❌ GPS timed out.";

  }
  else{

    document.getElementById("status").innerHTML =
      "❌ GPS error.";

  }

}


/* =========================================
   STOP GPS
========================================= */

function stopGPS(){

  if(watchID !== null){

    navigator.geolocation.clearWatch(
      watchID
    );

    watchID = null;

  }

  document.getElementById("status").innerHTML =
    "🔴 Live GPS stopped.";

}


/* =========================================
   ROUTE
========================================= */

async function calculateRoute(){

  const fromText =
  document.getElementById("from")
  .value
  .trim();

  const toText =
  document.getElementById("to")
  .value
  .trim();

  if(!fromText || !toText){

    document.getElementById("result").innerHTML =
      "⚠️ Enter From and To.";

    return;

  }

  document.getElementById("result").innerHTML =
    "🔎 Finding route...";

  try{

    const from =
    await searchPlace(fromText);

    const to =
    await searchPlace(toText);

    if(!from || !to){

      document.getElementById("result").innerHTML =
        "❌ One of the locations was not found.";

      return;

    }

    if(fromMarker){

      map.removeLayer(
        fromMarker
      );

    }

    if(toMarker){

      map.removeLayer(
        toMarker
      );

    }

    if(routeLine){

      map.removeLayer(
        routeLine
      );

    }

    fromMarker =
    L.marker(
      [from.lat,from.lon],
      {
        draggable:true
      }
    )
    .addTo(map)
    .bindTooltip(
      "FROM",
      {
        permanent:true,
        direction:"top",
        className:"from-label"
      }
    );

    toMarker =
    L.marker(
      [to.lat,to.lon],
      {
        draggable:true
      }
    )
    .addTo(map)
    .bindTooltip(
      "TO",
      {
        permanent:true,
        direction:"top",
        className:"to-label"
      }
    );

    await drawRoute(
      from.lat,
      from.lon,
      to.lat,
      to.lon
    );

  }
  catch(error){

    console.error(error);

    document.getElementById("result").innerHTML =
      "❌ Route service error.";

  }

}


/* =========================================
   DRAW ROUTE
========================================= */

async function drawRoute(
  fromLat,
  fromLon,
  toLat,
  toLon
){

  const url =
  "https://router.project-osrm.org/route/v1/driving/" +
  fromLon +
  "," +
  fromLat +
  ";" +
  toLon +
  "," +
  toLat +
  "?overview=full&geometries=geojson";

  const response =
  await fetch(url);

  const data =
  await response.json();

  if(data.code !== "Ok"){

    document.getElementById("result").innerHTML =
      "❌ No road route found.";

    return;

  }

  const route =
  data.routes[0];

  routeLine =
  L.geoJSON(
    route.geometry,
    {
      style:{
        weight:6,
        opacity:.85
      }
    }
  ).addTo(map);

  const km =
  (
    route.distance /
    1000
  ).toFixed(1);

  const minutes =
  Math.round(
    route.duration /
    60
  );

  let time;

  if(minutes >= 60){

    time =
      Math.floor(minutes / 60) +
      " hr " +
      (minutes % 60) +
      " min";

  }
  else{

    time =
      minutes +
      " min";

  }

  document.getElementById("result").innerHTML =
    "🛣️ <b>Route ready</b><br>" +
    "📏 Distance: <b>" +
    km +
    " km</b><br>" +
    "⏱️ Estimated time: <b>" +
    time +
    "</b>";

  map.fitBounds(
    routeLine.getBounds(),
    {
      padding:[30,30]
    }
  );

}


/* =========================================
   START
========================================= */

loadTaraba();

</script>

</body>
    </html>

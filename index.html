<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Taraba Live Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7f6;
}

header{
    background:#087f5b;
    color:white;
    text-align:center;
    padding:14px 10px;
}

header h1{
    margin:0;
    font-size:22px;
}

header p{
    margin:5px 0 0;
    font-size:13px;
}

.panel{
    background:white;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    position:relative;
    z-index:1000;
}

label{
    display:block;
    margin:4px 0;
    font-size:13px;
    font-weight:bold;
}

select,input{
    width:100%;
    padding:11px;
    margin-bottom:7px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:white;
}

button{
    width:100%;
    padding:12px;
    margin-bottom:7px;
    border:0;
    border-radius:8px;
    background:#087f5b;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.blue{
    background:#1565c0;
}

.red{
    background:#d62828;
}

#status{
    padding:5px 0;
    font-size:13px;
    font-weight:bold;
}

#result{
    font-size:14px;
    line-height:1.5;
    padding:4px 0;
}

#map{
    width:100%;
    height:calc(100vh - 440px);
    min-height:400px;
}

.live-label{
    background:#1565c0;
    color:white;
    border:0;
    border-radius:6px;
    padding:5px 8px;
    font-weight:bold;
}

.from-label{
    background:#087f5b;
    color:white;
    border:0;
    border-radius:6px;
    padding:5px 8px;
    font-weight:bold;
}

.to-label{
    background:#d62828;
    color:white;
    border:0;
    border-radius:6px;
    padding:5px 8px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🇳🇬 Taraba Live Map</h1>
    <p>LGA • Ward • Area • Live GPS • Road Route</p>
</header>

<div class="panel">

<label>🏛️ State</label>

<select id="state">
    <option value="Taraba">Taraba</option>
</select>

<label>🏛️ LGA</label>

<select id="lga">
    <option value="">Loading LGAs...</option>
</select>

<label>🏘️ Ward</label>

<select id="ward" disabled>
    <option value="">Select LGA first</option>
</select>

<label>📍 Area / Place</label>

<input
id="area"
type="text"
placeholder="Enter area or place"
>

<button onclick="showArea()">
📍 SHOW AREA
</button>

<label>🛣️ From</label>

<input
id="from"
type="text"
placeholder="Example: Jalingo"
>

<label>🛣️ To</label>

<input
id="to"
type="text"
placeholder="Example: Wukari"
>

<button onclick="calculateRoute()">
🛣️ CALCULATE ROUTE
</button>

<button class="blue" onclick="startGPS()">
📍 START LIVE LOCATION
</button>

<button class="red" onclick="stopGPS()">
⛔ STOP LIVE LOCATION
</button>

<div id="status">
GPS is not active.
</div>

<div id="result">
Loading Taraba locations...
</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   MAP
===================================================== */

const map = L.map("map").setView(
    [8.0,10.6],
    8
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap contributors"
    }
).addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let data = null;

let liveMarker = null;
let accuracyCircle = null;
let watchID = null;

let selectedMarker = null;

let fromMarker = null;
let toMarker = null;
let routeLine = null;


/* =====================================================
   DATA SOURCE
=====================================================

   Real Nigeria administrative dataset.
   It contains:
   State
   LGA
   Ward
   Coordinates
===================================================== */

const DATA_URL =
"https://raw.githubusercontent.com/open-admin-data/nigeria-administrative-divisions/main/data/hierarchy.json";


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    try{

        document.getElementById("result").innerHTML =
        "🔎 Loading Taraba LGAs and wards...";

        const response =
        await fetch(DATA_URL);

        if(!response.ok){
            throw new Error("Could not load data");
        }

        data =
        await response.json();

        setupTaraba();

    }
    catch(error){

        console.error(error);

        document.getElementById("result").innerHTML =
        "❌ Could not load the Taraba administrative data.";

    }
}


/* =====================================================
   FIND TARABA
===================================================== */

function setupTaraba(){

    let taraba = null;

    /*
       Different dataset structures are handled here.
    */

    if(Array.isArray(data)){

        taraba =
        data.find(
            x =>
            x.name?.en === "Taraba" ||
            x.name === "Taraba"
        );

    }
    else{

        taraba =
        data.Taraba ||
        data.taraba;

    }

    if(!taraba){

        document.getElementById("result").innerHTML =
        "❌ Taraba data was not found.";

        return;
    }

    window.tarabaData = taraba;

    loadLGAs(taraba);
}


/* =====================================================
   LOAD LGAs
===================================================== */

function loadLGAs(taraba){

    const lgaSelect =
    document.getElementById("lga");

    lgaSelect.innerHTML =
    '<option value="">Select LGA</option>';

    let lgas = [];

    /*
       Try common hierarchy formats.
    */

    if(Array.isArray(taraba.children)){

        lgas = taraba.children;

    }
    else if(Array.isArray(taraba.lgas)){

        lgas = taraba.lgas;

    }

    /*
       Save them.
    */

    window.tarabaLGAs = lgas;

    lgas.forEach(
        (lga,index)=>{

            const option =
            document.createElement("option");

            option.value = index;

            option.textContent =
            getName(lga);

            lgaSelect.appendChild(option);

        }
    );

    lgaSelect.onchange =
    function(){

        loadWards(
            Number(this.value)
        );

    };

    document.getElementById("result").innerHTML =
    "🇳🇬 <b>Taraba State</b><br>" +
    "Select an LGA to see its wards.";

}


/* =====================================================
   GET NAME
===================================================== */

function getName(item){

    if(typeof item === "string"){
        return item;
    }

    return (
        item?.name?.en ||
        item?.name?.local ||
        item?.name ||
        item?.level_name?.en ||
        "Unknown"
    );

}


/* =====================================================
   GET COORDINATES
===================================================== */

function getCoordinates(item){

    const lat =
    Number(
        item?.geo?.lat ??
        item?.latitude ??
        item?.lat
    );

    const lon =
    Number(
        item?.geo?.lon ??
        item?.longitude ??
        item?.lon
    );

    if(
        Number.isFinite(lat) &&
        Number.isFinite(lon)
    ){

        return {
            lat,
            lon
        };

    }

    return null;

}


/* =====================================================
   LOAD WARDS
===================================================== */

function loadWards(index){

    const wardSelect =
    document.getElementById("ward");

    wardSelect.innerHTML =
    '<option value="">Select Ward</option>';

    wardSelect.disabled = true;

    if(
        !Number.isInteger(index) ||
        !window.tarabaLGAs[index]
    ){

        return;

    }

    const lga =
    window.tarabaLGAs[index];

    let wards = [];

    if(Array.isArray(lga.children)){

        wards = lga.children;

    }
    else if(Array.isArray(lga.wards)){

        wards = lga.wards;

    }

    window.currentWards = wards;

    wards.forEach(
        (ward,i)=>{

            const option =
            document.createElement("option");

            option.value = i;

            option.textContent =
            getName(ward);

            wardSelect.appendChild(option);

        }
    );

    wardSelect.disabled = false;

    document.getElementById("result").innerHTML =
    "🏛️ LGA: <b>"+
    getName(lga)+
    "</b><br>"+
    "Select a ward.";

    wardSelect.onchange =
    showWard;

}


/* =====================================================
   SHOW WARD
===================================================== */

function showWard(){

    const index =
    Number(
        document.getElementById("ward").value
    );

    if(
        !Number.isInteger(index) ||
        !window.currentWards[index]
    ){

        return;

    }

    const ward =
    window.currentWards[index];

    const coordinates =
    getCoordinates(ward);

    if(!coordinates){

        document.getElementById("result").innerHTML =
        "⚠️ This ward has no coordinates.";

        return;

    }

    if(selectedMarker){

        map.removeLayer(selectedMarker);

    }

    selectedMarker =
    L.marker(
        [
            coordinates.lat,
            coordinates.lon
        ]
    )
    .addTo(map)
    .bindTooltip(
        getName(ward),
        {
            permanent:true,
            direction:"top"
        }
    );

    map.setView(
        [
            coordinates.lat,
            coordinates.lon
        ],
        14
    );

    document.getElementById("result").innerHTML =
    "🏘️ Ward: <b>"+
    getName(ward)+
    "</b><br>"+
    "📍 Location displayed on map.";

    document.getElementById("area").value =
    getName(ward);

}


/* =====================================================
   AREA
===================================================== */

async function showArea(){

    const area =
    document.getElementById("area")
    .value
    .trim();

    if(!area){

        document.getElementById("result").innerHTML =
        "⚠️ Enter an area or place.";

        return;

    }

    document.getElementById("result").innerHTML =
    "🔎 Finding area...";

    try{

        const result =
        await geocode(area);

        if(!result){

            document.getElementById("result").innerHTML =
            "❌ Area not found.";

            return;

        }

        if(selectedMarker){

            map.removeLayer(selectedMarker);

        }

        selectedMarker =
        L.marker(
            [
                result.lat,
                result.lon
            ]
        )
        .addTo(map)
        .bindTooltip(
            area,
            {
                permanent:true,
                direction:"top"
            }
        );

        map.setView(
            [
                result.lat,
                result.lon
            ],
            15
        );

        document.getElementById("result").innerHTML =
        "📍 Area: <b>"+
        area+
        "</b><br>"+
        "🗺️ Location shown on map.";

    }
    catch(error){

        document.getElementById("result").innerHTML =
        "❌ Could not find this area.";

    }

}


/* =====================================================
   GEOCODE
===================================================== */

async function geocode(place){

    const url =
    "https://nominatim.openstreetmap.org/search"+
    "?format=jsonv2"+
    "&limit=1"+
    "&q="+
    encodeURIComponent(
        place+
        ", Taraba, Nigeria"
    );

    const response =
    await fetch(url);

    const results =
    await response.json();

    if(!results.length){

        return null;

    }

    return {
        lat:Number(results[0].lat),
        lon:Number(results[0].lon)
    };

}


/* =====================================================
   LIVE GPS
===================================================== */

function startGPS(){

    if(!navigator.geolocation){

        document.getElementById("status").innerHTML =
        "❌ GPS is not supported.";

        return;

    }

    document.getElementById("status").innerHTML =
    "🔎 Getting your live location...";

    if(watchID !== null){

        navigator.geolocation.clearWatch(
            watchID
        );

    }

    watchID =
    navigator.geolocation.watchPosition(
        updateGPS,
        gpsError,
        {
            enableHighAccuracy:true,
            maximumAge:3000,
            timeout:20000
        }
    );

}


/* =====================================================
   GPS UPDATE
===================================================== */

function updateGPS(position){

    const lat =
    position.coords.latitude;

    const lon =
    position.coords.longitude;

    /*
       Accuracy is deliberately NOT shown.
    */

    document.getElementById("status").innerHTML =
    "🟢 LIVE GPS ACTIVE";

    if(!liveMarker){

        liveMarker =
        L.marker(
            [
                lat,
                lon
            ]
        )
        .addTo(map)
        .bindTooltip(
            "📍 YOU ARE HERE",
            {
                permanent:true,
                direction:"top",
                className:"live-label"
            }
        );

        accuracyCircle =
        L.circle(
            [
                lat,
                lon
            ],
            {
                radius:30,
                weight:1,
                fillOpacity:.08
            }
        ).addTo(map);

        map.setView(
            [
                lat,
                lon
            ],
            16
        );

    }
    else{

        liveMarker.setLatLng(
            [
                lat,
                lon
            ]
        );

        accuracyCircle.setLatLng(
            [
                lat,
                lon
            ]
        );

    }

    document.getElementById("result").innerHTML =
    "📍 <b>Your live location is active.</b>";

}


/* =====================================================
   GPS ERROR
===================================================== */

function gpsError(error){

    if(error.code === 1){

        document.getElementById("status").innerHTML =
        "❌ Location permission denied.";

    }
    else if(error.code === 2){

        document.getElementById("status").innerHTML =
        "❌ Location unavailable.";

    }
    else if(error.code === 3){

        document.getElementById("status").innerHTML =
        "❌ GPS timed out.";

    }
    else{

        document.getElementById("status").innerHTML =
        "❌ GPS error.";

    }

}


/* =====================================================
   STOP GPS
===================================================== */

function stopGPS(){

    if(watchID !== null){

        navigator.geolocation.clearWatch(
            watchID
        );

        watchID = null;

    }

    document.getElementById("status").innerHTML =
    "🔴 Live GPS stopped.";

}


/* =====================================================
   ROUTE
===================================================== */

async function calculateRoute(){

    const fromText =
    document.getElementById("from")
    .value
    .trim();

    const toText =
    document.getElementById("to")
    .value
    .trim();

    if(!fromText || !toText){

        document.getElementById("result").innerHTML =
        "⚠️ Enter both From and To.";

        return;

    }

    document.getElementById("result").innerHTML =
    "🔎 Finding route...";

    try{

        const from =
        await geocode(fromText);

        const to =
        await geocode(toText);

        if(!from || !to){

            document.getElementById("result").innerHTML =
            "❌ Could not find one of the locations.";

            return;

        }

        if(fromMarker){

            map.removeLayer(fromMarker);

        }

        if(toMarker){

            map.removeLayer(toMarker);

        }

        if(routeLine){

            map.removeLayer(routeLine);

        }

        fromMarker =
        L.marker(
            [
                from.lat,
                from.lon
            ],
            {
                draggable:true
            }
        )
        .addTo(map)
        .bindTooltip(
            "FROM",
            {
                permanent:true,
                direction:"top",
                className:"from-label"
            }
        );

        toMarker =
        L.marker(
            [
                to.lat,
                to.lon
            ],
            {
                draggable:true
            }
        )
        .addTo(map)
        .bindTooltip(
            "TO",
            {
                permanent:true,
                direction:"top",
                className:"to-label"
            }
        );

        await drawRoute(
            from.lat,
            from.lon,
            to.lat,
            to.lon
        );

    }
    catch(error){

        console.error(error);

        document.getElementById("result").innerHTML =
        "❌ Route service error.";

    }

}


/* =====================================================
   DRAW ROUTE
===================================================== */

async function drawRoute(
    fromLat,
    fromLon,
    toLat,
    toLon
){

    const url =
    "https://router.project-osrm.org/route/v1/driving/"+
    fromLon+
    ","+
    fromLat+
    ";"+
    toLon+
    ","+
    toLat+
    "?overview=full&geometries=geojson";

    const response =
    await fetch(url);

    const data =
    await response.json();

    if(data.code !== "Ok"){

        document.getElementById("result").innerHTML =
        "❌ No road route found.";

        return;

    }

    const route =
    data.routes[0];

    routeLine =
    L.geoJSON(
        route.geometry,
        {
            style:{
                weight:6,
                opacity:.85
            }
        }
    ).addTo(map);

    const km =
    (route.distance/1000)
    .toFixed(1);

    const minutes =
    Math.round(
        route.duration/60
    );

    let time;

    if(minutes >= 60){

        time =
        Math.floor(minutes/60)+
        " hr "+
        (minutes%60)+
        " min";

    }
    else{

        time =
        minutes+
        " min";

    }

    document.getElementById("result").innerHTML =
    "🛣️ <b>Route ready</b><br>"+
    "📏 Distance: <b>"+
    km+
    " km</b><br>"+
    "⏱️ Estimated time: <b>"+
    time+
    "</b>";

    map.fitBounds(
        routeLine.getBounds(),
        {
            padding:[30,30]
        }
    );

}


/* =====================================================
   START
===================================================== */

loadData();

</script>

</body>
  </html>
